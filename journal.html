<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梦境日志 - DreamMind</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #2d1b4e 100%);
            min-height: 100vh;
            color: #e8e8ff;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #a78bfa, #c4b5fd, #a78bfa);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-text 3s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes gradient-text {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .header p {
            color: #a5b4fc;
            font-size: 1rem;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .nav-link {
            padding: 10px 24px;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 25px;
            color: #c4b5fd;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .nav-link:hover {
            background: rgba(139, 92, 246, 0.3);
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            border-color: #a78bfa;
            color: #fff;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #a78bfa;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #6b7280;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: #c4b5fd;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #6b7280;
            margin-bottom: 20px;
        }

        .btn-primary {
            display: inline-block;
            padding: 12px 28px;
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            border: none;
            border-radius: 25px;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .journal-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .journal-card {
            background: rgba(30, 30, 60, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(139, 92, 246, 0.3);
            transition: all 0.3s ease;
        }

        .journal-card:hover {
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.2);
        }

        .journal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .journal-date {
            font-size: 0.85rem;
            color: #a78bfa;
        }

        .journal-model {
            font-size: 0.8rem;
            padding: 4px 12px;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            color: #c4b5fd;
        }

        .journal-model.fallback {
            background: rgba(245, 158, 11, 0.15);
            color: #fde68a;
        }

        .journal-emotion {
            display: inline-block;
            font-size: 0.8rem;
            padding: 4px 12px;
            background: rgba(236, 72, 153, 0.2);
            border-radius: 12px;
            color: #f9a8d4;
            margin-bottom: 12px;
        }

        .journal-dream {
            color: #d1d5db;
            line-height: 1.6;
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(20, 20, 40, 0.5);
            border-radius: 12px;
            font-style: italic;
        }

        .journal-analysis {
            display: grid;
            gap: 12px;
        }

        .analysis-item {
            padding: 12px;
            background: rgba(20, 20, 40, 0.5);
            border-radius: 12px;
            border-left: 3px solid #8b5cf6;
        }

        .analysis-item h4 {
            color: #a78bfa;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .analysis-item p {
            color: #e2e8f0;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .journal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(139, 92, 246, 0.2);
        }

        .btn-action {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-expand {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.4);
        }

        .btn-expand:hover {
            background: rgba(139, 92, 246, 0.3);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .collapsed .analysis-item:nth-child(n+3) {
            display: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: rgba(30, 30, 60, 0.95);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(139, 92, 246, 0.4);
        }

        .modal h3 {
            color: #fca5a5;
            margin-bottom: 16px;
        }

        .modal p {
            color: #d1d5db;
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-cancel {
            padding: 10px 20px;
            background: rgba(107, 114, 128, 0.2);
            border: 1px solid rgba(107, 114, 128, 0.4);
            border-radius: 8px;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            background: rgba(107, 114, 128, 0.3);
        }

        .btn-confirm {
            padding: 10px 20px;
            background: rgba(239, 68, 68, 0.3);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 8px;
            color: #fca5a5;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-confirm:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 10px 16px;
            background: rgba(20, 20, 40, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            color: #e8e8ff;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .filter-select:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        .actions-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .actions-bar .btn-action {
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(139, 92, 246, 0.4);
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
        }

        .actions-bar .btn-action:hover {
            background: rgba(139, 92, 246, 0.3);
            transform: translateY(-2px);
        }

        .actions-bar .btn-clear {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .actions-bar .btn-clear:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 0.9rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }

        .toast.success {
            background: rgba(34, 197, 94, 0.9);
            color: #fff;
        }

        .toast.error {
            background: rgba(239, 68, 68, 0.9);
            color: #fff;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .stats-bar {
                gap: 20px;
            }

            .stat-number {
                font-size: 1.5rem;
            }

            .journal-card {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="header">
            <h1>📖 梦境日志</h1>
            <p>记录每一个梦境，探索内心世界</p>
        </div>

        <div class="nav-links">
            <a href="index.html" class="nav-link">🌙 解梦</a>
            <a href="journal.html" class="nav-link active">📖 日志</a>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <div class="stat-number" id="totalDreams">0</div>
                <div class="stat-label">记录梦境</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="thisMonth">0</div>
                <div class="stat-label">本月梦境</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="topEmotion">-</div>
                <div class="stat-label">最常情绪</div>
            </div>
        </div>

        <div class="actions-bar" id="actionsBar" style="display: none;">
            <button class="btn-action btn-export" id="exportBtn">📥 导出日志</button>
            <label class="btn-action btn-import">
                📤 导入日志
                <input type="file" id="importFile" accept=".json" hidden />
            </label>
            <button class="btn-action btn-clear" id="clearBtn">🗑️ 清空日志</button>
        </div>

        <div class="filter-bar" id="filterBar" style="display: none;">
            <select class="filter-select" id="emotionFilter">
                <option value="">全部情绪</option>
                <option value="焦虑">😰 焦虑</option>
                <option value="恐惧">😨 恐惧</option>
                <option value="喜悦">😊 喜悦</option>
                <option value="困惑">😕 困惑</option>
                <option value="平静">😌 平静</option>
            </select>
            <select class="filter-select" id="modelFilter">
                <option value="">全部模型</option>
                <option value="deepseek">🧊 DeepSeek</option>
                <option value="kimi">🦊 Kimi</option>
                <option value="doubao">🔴 豆包</option>
            </select>
            <select class="filter-select" id="sortOrder">
                <option value="newest">最新优先</option>
                <option value="oldest">最早优先</option>
            </select>
        </div>

        <div id="journalContent"></div>
    </div>

    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <h3>🗑️ 删除梦境</h3>
            <p>确定要删除这条梦境记录吗？此操作无法撤销。</p>
            <div class="modal-actions">
                <button class="btn-cancel" id="cancelDelete">取消</button>
                <button class="btn-confirm" id="confirmDelete">删除</button>
            </div>
        </div>
    </div>

    <script>
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                starsContainer.appendChild(star);
            }
        }

        createStars();

        let dreams = JSON.parse(localStorage.getItem('dreamJournal') || '[]');
        let deleteIndex = null;

        const emotionFilter = document.getElementById('emotionFilter');
        const modelFilter = document.getElementById('modelFilter');
        const sortOrder = document.getElementById('sortOrder');

        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hour = String(date.getHours()).padStart(2, '0');
            const minute = String(date.getMinutes()).padStart(2, '0');
            return `${year}年${month}月${day}日 ${hour}:${minute}`;
        }

        function getModelName(model) {
            const models = {
                'deepseek': '🧊 DeepSeek',
                'kimi': '🦊 Kimi',
                'doubao': '🔴 豆包'
            };
            return models[model] || model;
        }

        function getModelBadge(dream) {
            if (dream.actualSource === 'ai') {
                return {
                    text: `${dream.actualSourceLabel || getModelName(dream.model)} AI`,
                    className: 'journal-model'
                };
            }

            return {
                text: `本地兜底 · 原选择 ${dream.requestedModelLabel || getModelName(dream.model)}`,
                className: 'journal-model fallback'
            };
        }

        function updateStats() {
            const totalDreams = document.getElementById('totalDreams');
            const thisMonth = document.getElementById('thisMonth');
            const topEmotion = document.getElementById('topEmotion');

            totalDreams.textContent = dreams.length;

            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            const monthCount = dreams.filter(d => {
                const date = new Date(d.timestamp);
                return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
            }).length;
            thisMonth.textContent = monthCount;

            const emotions = dreams.filter(d => d.emotion).map(d => d.emotion);
            if (emotions.length > 0) {
                const emotionCounts = {};
                emotions.forEach(e => {
                    emotionCounts[e] = (emotionCounts[e] || 0) + 1;
                });
                const topEmotionName = Object.entries(emotionCounts)
                    .sort((a, b) => b[1] - a[1])[0][0];
                topEmotion.textContent = topEmotionName;
            } else {
                topEmotion.textContent = '-';
            }
        }

        function getFilteredDreams() {
            let filtered = [...dreams];

            if (emotionFilter.value) {
                filtered = filtered.filter(d => d.emotion === emotionFilter.value);
            }

            if (modelFilter.value) {
                filtered = filtered.filter(d => d.model === modelFilter.value);
            }

            if (sortOrder.value === 'newest') {
                filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            } else {
                filtered.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            }

            return filtered;
        }

        function renderJournal() {
            const content = document.getElementById('journalContent');
            const filterBar = document.getElementById('filterBar');
            const filteredDreams = getFilteredDreams();

            const actionsBar = document.getElementById('actionsBar');
            
            if (dreams.length === 0) {
                filterBar.style.display = 'none';
                actionsBar.style.display = 'none';
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🌙</div>
                        <h3>还没有梦境记录</h3>
                        <p>开始记录你的梦境，探索内心世界吧</p>
                        <a href="index.html" class="btn-primary">✨ 开始解梦</a>
                    </div>
                `;
                return;
            }

            filterBar.style.display = 'flex';
            actionsBar.style.display = 'flex';

            if (filteredDreams.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h3>没有找到匹配的梦境</h3>
                        <p>试试调整筛选条件</p>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div class="journal-list">
                    ${filteredDreams.map((dream, index) => {
                        const originalIndex = dreams.findIndex(d => d.timestamp === dream.timestamp);
                        const modelBadge = getModelBadge(dream);
                        return `
                            <div class="journal-card collapsed" data-index="${originalIndex}">
                                <div class="journal-header">
                                    <div class="journal-date">${formatDate(dream.timestamp)}</div>
                                    <div class="${modelBadge.className}">${modelBadge.text}</div>
                                </div>
                                ${dream.emotion ? `<div class="journal-emotion">${dream.emotion}</div>` : ''}
                                <div class="journal-dream">${dream.dream}</div>
                                <div class="journal-analysis">
                                    <div class="analysis-item">
                                        <h4>🗝️ 核心象征</h4>
                                        <p>${dream.analysis?.symbol || '-'}</p>
                                    </div>
                                    <div class="analysis-item">
                                        <h4>🧠 潜意识状态</h4>
                                        <p>${dream.analysis?.subconscious || '-'}</p>
                                    </div>
                                    <div class="analysis-item">
                                        <h4>💗 情绪分析</h4>
                                        <p>${dream.analysis?.emotion || '-'}</p>
                                    </div>
                                    <div class="analysis-item">
                                        <h4>🌱 暖心建议</h4>
                                        <p>${(dream.analysis?.advice || '-').replace(/\n/g, '<br>')}</p>
                                    </div>
                                </div>
                                <div class="journal-actions">
                                    <button class="btn-action btn-expand" onclick="toggleExpand(this)">展开全部</button>
                                    <button class="btn-action btn-delete" onclick="showDeleteModal(${originalIndex})">删除</button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function toggleExpand(btn) {
            const card = btn.closest('.journal-card');
            const isCollapsed = card.classList.contains('collapsed');
            
            if (isCollapsed) {
                card.classList.remove('collapsed');
                btn.textContent = '收起';
            } else {
                card.classList.add('collapsed');
                btn.textContent = '展开全部';
            }
        }

        function showDeleteModal(index) {
            deleteIndex = index;
            document.getElementById('deleteModal').classList.add('show');
        }

        document.getElementById('cancelDelete').addEventListener('click', () => {
            deleteIndex = null;
            document.getElementById('deleteModal').classList.remove('show');
        });

        document.getElementById('confirmDelete').addEventListener('click', () => {
            if (deleteIndex !== null) {
                dreams.splice(deleteIndex, 1);
                localStorage.setItem('dreamJournal', JSON.stringify(dreams));
                deleteIndex = null;
                document.getElementById('deleteModal').classList.remove('show');
                updateStats();
                renderJournal();
            }
        });

        emotionFilter.addEventListener('change', renderJournal);
        modelFilter.addEventListener('change', renderJournal);
        sortOrder.addEventListener('change', renderJournal);

        function showToast(message, type = 'success') {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.className = 'toast';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        document.getElementById('exportBtn').addEventListener('click', () => {
            if (dreams.length === 0) {
                showToast('暂无梦境数据可导出', 'error');
                return;
            }

            const dataStr = JSON.stringify(dreams, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dream-journal-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('✅ 梦境日志已导出');
        });

        document.getElementById('importFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const importedDreams = JSON.parse(event.target.result);
                    
                    if (!Array.isArray(importedDreams)) {
                        showToast('❌ 无效的文件格式', 'error');
                        return;
                    }

                    dreams = [...dreams, ...importedDreams];
                    localStorage.setItem('dreamJournal', JSON.stringify(dreams));
                    updateStats();
                    renderJournal();
                    showToast('✅ 梦境日志已导入');
                } catch (error) {
                    showToast('❌ 文件解析失败', 'error');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (dreams.length === 0) {
                showToast('暂无梦境数据可清空', 'error');
                return;
            }

            if (confirm('确定要清空所有梦境记录吗？此操作无法撤销！')) {
                dreams = [];
                localStorage.removeItem('dreamJournal');
                updateStats();
                renderJournal();
                showToast('✅ 梦境日志已清空');
            }
        });

        updateStats();
        renderJournal();
    </script>
</body>
</html>
